<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Feat RPG: Action Demo</title>
  <link rel="manifest" href="manifest.json">
  <!-- 引入免費開源 Phaser 3 遊戲引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0f12;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* 虛擬操作按鍵區 */
    .controls-container {
      height: 40vh;
      background: #181c24;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 10px;
      box-sizing: border-box;
      border-top: 2px solid #ff6600;
    }
    .d-pad, .action-pad {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid #ff6600;
      background: #251810;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    .btn:active { background: #ff6600; }
    .btn-ss3 { border-color: #ffd700; background: #3d3000; color: #ffd700; }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- 手機實體按鍵（測試手感專用） -->
  <div class="controls-container">
    <div class="d-pad">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="btn" id="btn-dodge" style="border-color:#00ffff;">閃避</div>
      <div class="btn" id="btn-parry" style="border-color:#ffd700;">招架</div>
      <div class="btn" id="btn-attack">攻擊</div>
      <div class="btn btn-ss3" id="btn-ss3">SS3</div>
    </div>
  </div>

  <script>
    // PWA Service Worker 註冊
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Phaser 3 遊戲主配置
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 450,
      parent: 'game-container',
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: 1000 }, debug: false }
      },
      scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    let player, boss, floor;
    let bossWarningCircle;
    let isParryWindow = false; // 是否處於可招架時間
    let isBossStunned = false; // Boss 是否處於彈刀硬直
    let bossHp = 1000;
    let bossHpText, stateText;

    function preload() {}

    function create() {
      // 建立地板
      floor = this.add.rectangle(400, 420, 800, 40, 0x333333);
      this.physics.add.existing(floor, true);

      // 建立玩家 (藍色方塊代表勇者)
      player = this.add.rectangle(200, 300, 40, 70, 0x00aaff);
      this.physics.add.existing(player);
      player.body.setCollideWorldBounds(true);
      this.physics.add.collider(player, floor);

      // 建立 Boss (紅色方塊代表巨魔)
      boss = this.add.rectangle(600, 300, 70, 110, 0xff3333);
      this.physics.add.existing(boss);
      boss.body.setCollideWorldBounds(true);
      this.physics.add.collider(boss, floor);

      // Boss 招架黃光提示圈
      bossWarningCircle = this.add.circle(600, 230, 25, 0xffff00).setVisible(false);

      // UI 文字
      bossHpText = this.add.text(16, 16, 'BOSS HP: 1000 / 1000', { fontSize: '18px', fill: '#ff6600' });
      stateText = this.add.text(16, 45, '戰鬥狀態: 觀察 Boss 招式...', { fontSize: '14px', fill: '#fff' });

      // 綁定手持虛擬按鍵
      document.getElementById('btn-attack').addEventListener('touchstart', () => playerAttack());
      document.getElementById('btn-parry').addEventListener('touchstart', () => playerParry());
      document.getElementById('btn-dodge').addEventListener('touchstart', () => playerDodge());
      document.getElementById('btn-ss3').addEventListener('touchstart', () => playerSS3());

      // 啟動 Boss 攻擊 AI 迴圈
      this.time.addEvent({ delay: 3500, callback: triggerBossAttack, callbackScope: this, loop: true });
    }

    function update() {
      if (bossWarningCircle) {
        bossWarningCircle.x = boss.x;
      }
    }

    // Boss 發動可招架攻擊（黃光提示）
    function triggerBossAttack() {
      if (isBossStunned || bossHp <= 0) return;

      stateText.setText('⚠️ BOSS 發動重擊！[抓準黃光瞬間點擊招架！]');
      bossWarningCircle.setVisible(true);
      isParryWindow = true;

      // 1 秒後若未被招架，Boss 揮刀
      setTimeout(() => {
        if (isParryWindow && !isBossStunned) {
          stateText.setText('💥 招架失敗！受到 Boss 重創！');
          player.fillColor = 0xff0000;
          setTimeout(() => player.fillColor = 0x00aaff, 300);
        }
        bossWarningCircle.setVisible(false);
        isParryWindow = false;
      }, 800);
    }

    // 玩家動作：招架 (Parry)
    function playerParry() {
      if (isParryWindow) {
        // 招架成功！SAO:MD 核心體驗！
        isParryWindow = false;
        isBossStunned = true;
        bossWarningCircle.setVisible(false);

        boss.fillColor = 0xffd700; // Boss 變成金黃色硬直狀態
        stateText.setText('⚡ PARRY 招架成功！BOSS 陷入大硬直！[快按 SS3 發動連攜！]');

        // Boss 硬直 3 秒
        setTimeout(() => {
          isBossStunned = false;
          boss.fillColor = 0xff3333;
          stateText.setText('戰鬥狀態: Boss 恢復姿態...');
        }, 3000);
      } else {
        stateText.setText('🛡️ 空招架！未抓準時機！');
      }
    }

    // 玩家動作：普通攻擊
    function playerAttack() {
      if (Math.abs(player.x - boss.x) < 100) {
        let dmg = isBossStunned ? 50 : 15; // 硬直狀態下傷害加倍
        bossHp = Math.max(0, bossHp - dmg);
        bossHpText.setText(`BOSS HP: ${bossHp} / 1000`);
        stateText.setText(`⚔️ 命中 Boss！造成 ${dmg} 點傷害 ${isBossStunned ? '(暴擊!)' : ''}`);
      }
    }

    // 玩家動作：SS3 切換連攜必殺技
    function playerSS3() {
      if (!isBossStunned) {
        return alert('SS3 必殺技需在【招架成功 Boss 硬直】時發動才能造成全額連攜暴擊！');
      }
      bossHp = Math.max(0, bossHp - 350);
      bossHpText.setText(`BOSS HP: ${bossHp} / 1000`);
      stateText.setText('🔥 必殺連攜！SS3 釋放！造成 350 點巨額暴擊傷害！');
    }

    // 玩家動作：閃避
    function playerDodge() {
      player.x -= 80;
      stateText.setText('🌀 完美後撤閃避！');
    }
  </script>
</body>
</html>
