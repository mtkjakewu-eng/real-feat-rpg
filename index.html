<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Feat RPG: SAO Action Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c0e; color: #fff; font-family: sans-serif; overflow: hidden; }
    #game-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
    #canvas-container { width: 100%; height: 60vh; position: relative; background: #12161f; }
    .instruction-overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 8px; border: 1px solid #ff6600; font-size: 0.85rem; pointer-events: none; z-index: 10; }
    .control-panel { height: 40vh; background: #141820; border-top: 2px solid #ff6600; display: flex; justify-content: space-around; align-items: center; padding: 10px; }
    .dpad-group, .action-group { display: flex; gap: 10px; align-items: center; }
    .btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #ff6600; background: #221810; color: #fff; font-weight: bold; font-size: 0.9rem; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); outline: none; }
    .btn:active { background: #ff6600 !important; transform: scale(0.9); }
    .btn-ss3 { border-color: #ffd700; background: #3a3000; color: #ffd700; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="game-layout">
    <div id="canvas-container">
      <div class="instruction-overlay">
        💡 <b>綠龍 Boss 戰鬥流：</b><br>
        1. 連點<b>【攻擊】</b>揮刀逼近 Boss<br>
        2. Boss 出現<b>黃光提示</b>時點擊<b>【招架】</b>彈刀<br>
        3. Boss 陷入硬直時，點擊<b>【SS3】</b>觸發大招！
      </div>
    </div>

    <div class="control-panel">
      <div class="dpad-group">
        <button class="btn" id="btn-left">◀</button>
        <button class="btn" id="btn-right">▶</button>
      </div>
      <div class="action-group">
        <button class="btn" id="btn-dodge" style="border-color:#00ffff;">閃避</button>
        <button class="btn" id="btn-parry" style="border-color:#ffd700;">招架</button>
        <button class="btn" id="btn-attack">攻擊</button>
        <button class="btn btn-ss3" id="btn-ss3">SS3</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');

    const config = {
      type: Phaser.AUTO,
      width: container.clientWidth,
      height: container.clientHeight,
      parent: 'canvas-container',
      physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
      scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, playerGfx, boss, bossWarning;
    let isParryWindow = false, isBossStunned = false;
    let bossHp = 2000, bossHpText, statusText, debugText;

    function preload() {
      // 載入綠龍 Boss
      this.load.image('boss', 'assets/boss.png');

      // 監聽圖檔載入失敗事件（除錯用）
      this.load.on('loaderror', (fileObj) => {
        if (debugText) debugText.setText(`⚠️ 圖檔讀取失敗: ${fileObj.src}`);
      });

      // 嘗試讀取 local 圖檔 (若失敗會自動降級用 Canvas 騎士替代)
      this.load.image('knight_img', 'assets/Idle.png');
    }

    function create() {
      const w = this.cameras.main.width;
      const h = this.cameras.main.height;

      // 地板線
      this.add.rectangle(w / 2, h * 0.75, w, 4, 0xff6600);

      // 建立玩家容器
      player = this.add.container(w * 0.25, h * 0.62);

      // 優先使用載入的圖片，若圖片載入失敗則用向量畫出精緻騎士
      if (this.textures.exists('knight_img') && this.textures.get('knight_img').key !== '__DEFAULT') {
        const sprite = this.add.sprite(0, 0, 'knight_img').setScale(1.2);
        player.add(sprite);
      } else {
        // 自製向量藍衣劍士 (絕對不會變成綠框)
        playerGfx = this.add.graphics();
        // 身體
        playerGfx.fillStyle(0x00aaff, 1);
        playerGfx.fillRect(-15, -40, 30, 50);
        // 頭部
        playerGfx.fillStyle(0xffcc99, 1);
        playerGfx.fillCircle(0, -50, 12);
        // 披風
        playerGfx.fillStyle(0x333333, 1);
        playerGfx.fillRect(-22, -40, 8, 45);
        // 大劍
        playerGfx.fillStyle(0xeeeeee, 1);
        playerGfx.fillRect(12, -60, 6, 60);
        playerGfx.fillStyle(0xffaa00, 1);
        playerGfx.fillRect(8, -20, 14, 6);

        player.add(playerGfx);
      }

      // 建立 Boss (綠龍)
      boss = this.add.sprite(w * 0.7, h * 0.52, 'boss').setScale(0.6);

      // 綠龍呼吸動畫
      this.tweens.add({
        targets: boss,
        y: h * 0.50,
        duration: 1500,
        ease: 'Sine.easeInOut',
        yoyo: true,
        repeat: -1
      });

      // 招架提示光圈
      bossWarning = this.add.circle(w * 0.7, h * 0.3, 30, 0xffff00).setVisible(false);

      // UI 介面
      bossHpText = this.add.text(20, 20, 'BOSS HP: 2000 / 2000', { fontSize: '20px', fill: '#ff6600', fontWeight: 'bold' });
      statusText = this.add.text(20, 50, '戰鬥開始！請點擊按鈕發動攻擊...', { fontSize: '15px', fill: '#ffffff' });
      debugText = this.add.text(20, 75, '路徑檢查中...', { fontSize: '12px', fill: '#ff3333' });

      // 按鈕事件
      bindBtn('btn-left', () => { player.x -= 30; statusText.setText('向左位移'); });
      bindBtn('btn-right', () => { player.x += 30; statusText.setText('向右位移'); });
      bindBtn('btn-attack', () => doAttack(this));
      bindBtn('btn-parry', () => doParry(this));
      bindBtn('btn-dodge', () => doDodge(this));
      bindBtn('btn-ss3', () => doSS3(this));

      // Boss 攻擊循環
      this.time.addEvent({ delay: 4000, callback: triggerBossAttack, callbackScope: this, loop: true });
    }

    function update() {
      if (bossWarning) bossWarning.x = boss.x;
    }

    function bindBtn(id, action) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); });
    }

    function triggerBossAttack() {
      if (isBossStunned || bossHp <= 0) return;
      statusText.setText('⚠️ 綠龍俯衝重擊！【快點擊招架！】');
      bossWarning.setVisible(true);
      boss.setTint(0xffaa00);
      isParryWindow = true;

      setTimeout(() => {
        if (isParryWindow && !isBossStunned) {
          statusText.setText('💥 招架太慢！受到重擊！');
        }
        bossWarning.setVisible(false);
        if (!isBossStunned) boss.clearTint();
        isParryWindow = false;
      }, 1200);
    }

    function doParry(scene) {
      if (isParryWindow) {
        isParryWindow = false;
        isBossStunned = true;
        bossWarning.setVisible(false);
        boss.setTint(0xffff00);

        statusText.setText('⚡ PARRY 成功！綠龍陷入硬直！【快按 SS3！】');

        setTimeout(() => {
          isBossStunned = false;
          boss.clearTint();
          statusText.setText('狀態：綠龍恢復對峙...');
        }, 3000);
      } else {
        statusText.setText('🛡️ 提早招架！未抓到黃光時間點！');
      }
    }

    function doAttack(scene) {
      if (Math.abs(player.x - boss.x) > 150) player.x = boss.x - 110;
      let dmg = isBossStunned ? 80 : 25;
      bossHp = Math.max(0, bossHp - dmg);
      bossHpText.setText(`BOSS HP: ${bossHp} / 2000`);

      scene.tweens.add({ targets: player, x: player.x + 30, duration: 90, yoyo: true });
      scene.cameras.main.shake(100, 0.008);
      boss.setTint(0xff6666);
      setTimeout(() => { if (!isBossStunned) boss.clearTint(); }, 100);

      statusText.setText(`⚔️ 揮劍攻擊！造成 ${dmg} 傷害`);
    }

    function doSS3(scene) {
      if (!isBossStunned) {
        statusText.setText('❌ SS3 失敗！必須在招架成功 Boss 硬直時發動！');
        return;
      }
      player.x = boss.x - 90;
      bossHp = Math.max(0, bossHp - 600);
      bossHpText.setText(`BOSS HP: ${bossHp} / 2000`);

      scene.cameras.main.shake(350, 0.02);
      boss.setTint(0xff0000);
      
      setTimeout(() => { if (isBossStunned) boss.setTint(0xffff00); }, 400);

      statusText.setText('🔥 SS3 必殺連攜爆發！造成 600 巨額暴擊傷害！');
    }

    function doDodge(scene) {
      scene.tweens.add({ targets: player, x: player.x - 100, duration: 150 });
      statusText.setText('🌀 快速後撤閃避！');
    }
  </script>
</body>
</html>
